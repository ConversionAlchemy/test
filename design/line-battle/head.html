<title>Line Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root { --bg: #1e1f1c; --panel: #26272a; --line: #46464d; --text: #e4e1d6; --dim: #9d9a90; --on: #f2efe6; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1 "VT323", ui-monospace, monospace; overflow: hidden; }
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#bar { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  background: var(--panel); border: 1px solid var(--line); padding: 4px; max-width: calc(100% - 20px); }
#bar button { font: inherit; color: var(--text); background: #1b1b1e; border: 1px solid var(--line); padding: 3px 9px; cursor: pointer; min-width: 30px; }
#bar button:hover:not(:disabled) { border-color: var(--dim); }
#bar button.on { background: var(--on); color: #151515; border-color: var(--on); }
#bar button.off { opacity: .45; }
#bar button:disabled { opacity: .35; cursor: default; }
#bar button:focus-visible { outline: 1px solid var(--on); outline-offset: 1px; }
#bar .gap { width: 6px; }
#bar .n { padding: 0 6px; font-size: 20px; }
#bar .g { color: #6fd07c; } #bar .r { color: #e8705e; }
#stat { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); color: var(--dim); font-size: 16px; pointer-events: none; }
</style>
<canvas id="field"></canvas>
<div id="bar">
  <button data-k="play" title="Space">▶</button>
  <button data-k="speed">1×</button>
  <span class="gap"></span>
  <button class="sel" data-k="line" title="1">Line</button>
  <button class="sel" data-k="column" title="2">Column</button>
  <button class="sel" data-k="square" title="3">Square</button>
  <button class="sel" data-k="loose" title="4">Loose</button>
  <button class="sel" data-k="hold" title="H">Hold fire</button>
  <span class="gap"></span>
  <span class="n g" id="gn">500</span><span class="n r" id="rn">100</span>
  <span class="gap"></span>
  <button data-k="snd">♪</button>
  <button data-k="reset">Reset</button>
</div>
<div id="stat"></div>
