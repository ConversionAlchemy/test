<title>Line Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root { --bg: #1e1f1c; --panel: #26272a; --line: #46464d; --text: #e4e1d6; --dim: #9d9a90; --on: #f2efe6; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1 "VT323", ui-monospace, monospace; overflow: hidden; }
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#bar { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  background: var(--panel); border: 1px solid var(--line); padding: 4px; max-width: calc(100% - 20px); }
#bar button { font: inherit; color: var(--text); background: #1b1b1e; border: 1px solid var(--line); padding: 3px 9px; cursor: pointer; min-width: 30px; }
#bar button:hover:not(:disabled) { border-color: var(--dim); }
#bar button.on { background: var(--on); color: #151515; border-color: var(--on); }
#bar button.off { opacity: .45; }
#bar button:disabled { opacity: .35; cursor: default; }
#bar button:focus-visible { outline: 1px solid var(--on); outline-offset: 1px; }
#bar .gap { width: 6px; }
#bar .n { padding: 0 6px; font-size: 20px; }
#bar .g { color: #6fd07c; } #bar .r { color: #e8705e; }
#dock { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
#dock > * { pointer-events: auto; }
#forms { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; background: var(--panel); border: 1px solid var(--line); padding: 4px; }
#forms[hidden] { display: none; }
#forms .gap { width: 8px; }
#dock button { font: inherit; color: var(--text); background: #1b1b1e; border: 1px solid var(--line); padding: 3px 9px; cursor: pointer; }
#dock button:hover:not(:disabled) { border-color: var(--dim); }
#forms button.on { background: var(--on); color: #151515; border-color: var(--on); }
#cards { display: flex; gap: 3px; overflow-x: auto; max-width: 100%; background: var(--panel); border: 1px solid var(--line); padding: 4px; }
#cards:empty { display: none; }
#dock .card { position: relative; flex: none; width: 54px; height: 70px; padding: 0; display: block; background: #1b1b1e; }
#dock .card canvas { position: absolute; left: 7px; top: 14px; width: 40px; height: 26px; }
#dock .card canvas.crk { left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
#dock .card.on { border-color: var(--on); box-shadow: inset 0 0 0 1px var(--on); background: #2e2f2a; }
#dock .card.gone { opacity: .5; transform: rotate(-3deg) translateY(4px); clip-path: polygon(0 0, 100% 0, 100% 58%, 82% 66%, 64% 58%, 44% 70%, 22% 60%, 0 52%); }
#dock .card.gone canvas:not(.crk) { filter: grayscale(1) brightness(.8); }
#dock .card.gone .hp i { background: #77766f; }
#dock .card:disabled { cursor: default; }
.card .st { position: absolute; right: 3px; top: 2px; font-size: 15px; color: var(--on); }
.card .cnt { position: absolute; left: 0; right: 0; bottom: 13px; text-align: center; font-size: 17px; }
.card .bar { position: absolute; left: 4px; right: 4px; height: 3px; background: #0e0e10; }
.card .bar i { display: block; height: 100%; }
.card .hp { bottom: 7px; } .card .hp i { background: #5fbf6c; }
.card .am { bottom: 3px; } .card .am i { background: #f2efe6; }
#side { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: 210px; background: var(--panel); border: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100% - 140px); overflow: auto; }
#side .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
#side .seg button { font: inherit; color: var(--text); background: #1b1b1e; border: 1px solid var(--line); padding: 3px 0; cursor: pointer; }
#side .seg button.on { background: var(--c); color: #121212; border-color: var(--c); }
#side .army { display: grid; grid-template-columns: auto 1fr; gap: 6px; align-items: baseline; border-left: 3px solid var(--c); padding-left: 6px; }
#side .army b { color: var(--c); font-size: 20px; font-weight: normal; } #side .army span { color: var(--dim); font-size: 16px; }
#side .sel { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 3px; }
#side .nm { display: flex; gap: 6px; align-items: center; font-size: 19px; margin-bottom: 2px; }
#side .nm i { font-style: normal; color: #121212; width: 16px; text-align: center; }
#side .pr { display: grid; grid-template-columns: 70px 1fr; align-items: center; column-gap: 6px; }
#side .pr span { color: var(--dim); } #side .pr b { font-weight: normal; text-align: right; }
#side .pr i { grid-column: 1 / -1; height: 3px; background: #0e0e10; } #side .pr u { display: block; height: 100%; }
@media (max-width: 700px) { #side { width: 160px; } }
#stat { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); color: var(--dim); font-size: 16px; pointer-events: none; }
</style>
<canvas id="field"></canvas>
<div id="bar">
  <button data-k="play" title="Space">▶</button>
  <button data-k="speed">1×</button>
  <span class="gap"></span>
  <span class="n g" id="gn">500</span><span class="n r" id="rn">100</span>
  <span class="gap"></span>
  <button data-k="snd">♪</button>
  <button data-k="reset">Reset</button>
  <button data-k="random">Random</button>
</div>
<div id="dock">
  <div id="forms" hidden>
    <button data-k="line" title="1">Line</button>
    <button data-k="column" title="2">Column</button>
    <button data-k="square" title="3">Square</button>
    <button data-k="loose" title="4">Loose</button>
    <span class="gap"></span>
    <button data-k="run" title="R">Run</button>
    <button data-k="direct" title="E">Direct</button>
    <button data-k="fire" title="F">Fire</button>
    <button data-k="charge" title="C">Charge</button>
    <button data-k="hold" title="H">Hold fire</button>
  </div>
  <div id="cards"></div>
</div>
<div id="side"></div>
<div id="stat"></div>
