<title>Sound Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root { --bg: #1e1f1c; --panel: #26272a; --line: #46464d; --text: #e4e1d6; --dim: #9d9a90; --on: #f2efe6; --acc: #5fbf6c; color-scheme: dark; }
:root[data-theme="light"] { --bg: #ecebe4; --panel: #f6f5ef; --line: #c9c7bd; --text: #1d1d1b; --dim: #6b6960; --on: #1d1d1b; --acc: #2f8a3c; color-scheme: light; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #ecebe4; --panel: #f6f5ef; --line: #c9c7bd; --text: #1d1d1b; --dim: #6b6960; --on: #1d1d1b; --acc: #2f8a3c; color-scheme: light; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.2 "VT323", ui-monospace, monospace; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); }
h1 { font-size: 26px; font-weight: normal; margin: 0 12px 0 0; }
h2 { font-size: 20px; font-weight: normal; color: var(--dim); margin: 22px 0 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { border: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.on { background: var(--on); color: var(--bg); }
button.hit { outline: 2px solid var(--acc); outline-offset: -2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
.grid button { text-align: left; display: flex; gap: 8px; }
.grid b { font-weight: normal; color: var(--dim); min-width: 28px; }
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid var(--line); padding: 3px; text-align: left; font-weight: normal; }
th { color: var(--dim); }
td button { width: 100%; text-align: left; display: flex; gap: 8px; }
td b { font-weight: normal; color: var(--dim); }
.wrap { overflow-x: auto; }
</style>
<main>
  <header>
    <h1>Sound Library</h1>
    <span class="seg" id="dist"><button data-d="near">Near</button><button data-d="mid">Mid</button><button data-d="far" class="on">Far</button></span>
    <span class="seg" id="count"><button data-n="1" class="on">Single</button><button data-n="12">Volley ×12</button></span>
  </header>
  <div id="lib"></div>
</main>

  ];
  const GUNS = ["pistol", "blunder", "musket", "grenade", "bomb", "ricos"];
  const CLIPS = [["mb", "Metal bash"], ["ms", "Metal strike"], ["w1", "Whizz 1"], ["w2", "Whizz 2"]];
  const fire = fn => {
    chain();
    if (count === 1) return fn();
    for (let i = 0; i < count; i++) setTimeout(fn, i * (20 + Math.random() * 45));
  };
  const btn = (code, name, fn) => `<button data-c="${code}"><b>${code}</b>${name}</button>`;
  const FN = {};
  const reg = (code, name, fn) => { FN[code] = fn; return btn(code, name, fn); };
  let h = "";
  h += `<h2>In the line battle now</h2><div class="grid">${NOW.map(([n, f], i) => reg(`A${i + 1}`, n, f)).join("")}</div>`;
  h += `<h2>Musket candidates</h2><div class="grid">${CAND.map(([n, f], i) => reg(`B${i + 1}`, n, f)).join("")}</div>`;
  h += `<h2>Material matrix</h2><div class="wrap"><table><tr><th></th><th>Hit</th><th>Knock</th><th>Glance</th><th>Drag</th><th>Crush</th></tr>${MATRIX.map((row, r) => `<tr><th>${row[0]}</th>${row.slice(1).map((k, c) => `<td>${reg(`C${r + 1}${"abcde"[c]}`, k, sfx(k))}</td>`).join("")}</tr>`).join("")}</table></div>`;
  h += `<h2>Guns and blasts</h2><div class="grid">${GUNS.map((k, i) => reg(`D${i + 1}`, k, at(k))).join("")}</div>`;
  h += `<h2>Recordings</h2><div class="grid">${reg("E0", "Volley recording", () => { vbuf().then(() => vplay(0, VOLLEY_BED[1], 0.9, 1, 1, 0.02, 1)); })}${CLIPS.map(([k, n], i) => reg(`E${i + 1}`, n, clipK(k))).join("")}${Object.keys(SND64).map((k, i) => reg(`E${i + CLIPS.length + 1}`, k, rec(k))).join("")}</div>`;
  h += `<h2>Every effect</h2><div class="grid">${Object.keys(SFX).sort().map((k, i) => reg(`F${i + 1}`, k, sfx(k))).join("")}</div>`;
  const lib = document.getElementById("lib");
  lib.innerHTML = h;
  lib.addEventListener("click", e => {
    const b = e.target.closest("button[data-c]");
    if (!b) return;
    gest = true;
    fire(FN[b.dataset.c]);
    b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 250);
  });
  document.getElementById("dist").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    dist = b.dataset.d; for (const x of e.currentTarget.children) x.classList.toggle("on", x === b); setDist();
  });
  document.getElementById("count").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    count = +b.dataset.n; for (const x of e.currentTarget.children) x.classList.toggle("on", x === b);
  });
})();
</script>
