# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master", "fluoria/region-merge"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

    # Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: master
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/ # a fork is served under its own repository name
      # The work in progress is served beside the live map, under /next/
      - name: Checkout next
        uses: actions/checkout@v5
        with:
          ref: fluoria/region-merge
          path: next-src
      - name: Build next
        working-directory: next-src
        run: npm ci && npm run build && mkdir -p ../dist/next && cp -r dist/. ../dist/next/
        env:
          BASE_PATH: /${{ github.event.repository.name }}/next/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist folder
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
